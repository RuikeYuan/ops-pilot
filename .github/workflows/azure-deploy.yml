name: Deploy existing Azure application
on:
  workflow_dispatch:
    inputs:
      image:
        description: 'Reviewed public image pinned by digest (registry/repo@sha256:...)'
        required: true
permissions:
  id-token: write
  contents: read
concurrency:
  group: azure-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Validate immutable image reference
        env: {IMAGE: '${{ inputs.image }}'}
        run: '[[ "$IMAGE" =~ @sha256:[a-f0-9]{64}$ ]]'
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Update application revision
        env:
          IMAGE: ${{ inputs.image }}
          APP: ${{ vars.AZURE_APP_NAME }}
          GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: az containerapp update --name "$APP" --resource-group "$GROUP" --image "$IMAGE" --output none
      - name: Verify application readiness
        env:
          APP_URL: ${{ vars.OPSPILOT_URL }}
        run: curl --fail --retry 8 --retry-delay 10 --retry-all-errors "$APP_URL/health/ready"
